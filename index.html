<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎲 台語大富翁</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1a2e;--bg2:#16213e;--surface:#0f3460;
  --gold:#f6c90e;--gold2:#b7791f;
  --red:#fc8181;--blue:#63b3ed;--green:#68d391;--yellow:#faf089;--purple:#d6bcfa;--orange:#fbd38d;
  --text:#f0e6d3;--muted:rgba(240,230,211,0.55);
  --radius:12px;
}
body{font-family:'PingFang TC','Noto Sans TC','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh}
.screen.active{display:flex;flex-direction:column}

/* ── SETUP SCREEN ── */
#setup{background:radial-gradient(ellipse at top,#1a1a2e 0%,#0f3460 100%);align-items:center;padding:20px;overflow-y:auto}
.setup-box{width:100%;max-width:680px;padding-bottom:40px}
.game-logo{text-align:center;margin-bottom:30px}
.game-logo h1{font-size:2.5rem;font-weight:900;letter-spacing:2px;text-shadow:0 0 30px var(--gold);color:var(--gold)}
.game-logo p{font-size:.95rem;color:var(--muted);margin-top:6px}
.setup-section{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.setup-section h3{font-size:.9rem;color:var(--gold);margin-bottom:14px;letter-spacing:1px;text-transform:uppercase}
.field-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.field-row label{font-size:.88rem;color:var(--muted);min-width:70px;flex-shrink:0}
.field-input{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;padding:8px 14px;color:var(--text);font-size:.95rem;width:100%;outline:none;transition:border-color .2s}
.field-input:focus{border-color:var(--gold)}
.team-count-btns{display:flex;gap:8px}
.count-btn{width:44px;height:44px;border-radius:10px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--text);font-size:1.2rem;font-weight:700;cursor:pointer;transition:all .2s}
.count-btn.sel{border-color:var(--gold);background:rgba(246,201,14,.15);color:var(--gold)}

/* Team cards */
.team-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.team-cards{grid-template-columns:1fr}}
.team-card{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12);border-radius:10px;padding:14px;transition:border-color .2s}
.team-card.hidden{display:none}
.team-card-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.team-dot{width:14px;height:14px;border-radius:50%}
.team-name-input{background:transparent;border:none;border-bottom:1px solid rgba(255,255,255,.2);color:var(--text);font-size:.95rem;font-weight:600;width:100%;outline:none;padding:2px 0}
.char-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.char-opt{width:54px;height:54px;border-radius:10px;border:2px solid rgba(255,255,255,.15);background:rgba(255,255,255,.04);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s;flex-shrink:0}
.char-opt:hover{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.1)}
.char-opt.sel{border-color:var(--gold);background:rgba(246,201,14,.18)}
.char-opt .ce{font-size:1.6rem;line-height:1}
.char-opt .cn{font-size:.6rem;color:var(--muted)}

/* Class select buttons */
.class-btns{display:flex;gap:10px}
.class-btn{padding:8px 28px;border-radius:20px;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--text);font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px}
.class-btn:hover{border-color:var(--gold);color:var(--gold)}
.class-btn.sel{background:rgba(246,201,14,.18);border-color:var(--gold);color:var(--gold)}

/* Taken character */
.char-opt.char-taken{opacity:.35;cursor:not-allowed;position:relative}
.char-opt.char-taken:hover{border-color:rgba(255,255,255,.15);background:rgba(255,255,255,.04)}
.char-x{position:absolute;top:2px;right:4px;font-size:.6rem;color:#fc8181;font-weight:900}

.load-section{background:rgba(246,201,14,.06);border:1px solid rgba(246,201,14,.2);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.load-section h3{font-size:.85rem;color:var(--gold);margin-bottom:10px}
.save-list{display:flex;flex-direction:column;gap:6px;max-height:120px;overflow-y:auto}
.save-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.06);border-radius:8px;padding:8px 12px;font-size:.85rem;cursor:pointer;transition:background .15s}
.save-item:hover{background:rgba(255,255,255,.12)}
.save-item .si-info{display:flex;flex-direction:column;gap:2px}
.save-item .si-name{font-weight:600;color:var(--text)}
.save-item .si-time{font-size:.75rem;color:var(--muted)}
.save-item .si-resume{padding:4px 12px;background:var(--gold);color:#1a1a2e;border-radius:20px;font-size:.78rem;font-weight:700;border:none;cursor:pointer}

.btn-start{width:100%;padding:16px;background:linear-gradient(135deg,#f6c90e,#ed8936);border:none;border-radius:var(--radius);color:#1a1a2e;font-size:1.15rem;font-weight:900;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 20px rgba(246,201,14,.4);transition:all .2s;margin-top:8px}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(246,201,14,.5)}
.btn-start:active{transform:translateY(0)}

/* ── GAME SCREEN ── */
#game{background:var(--bg);flex-direction:column;padding:0}
.game-header{background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.1);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.game-header .gh-left h2{font-size:1rem;font-weight:700;color:var(--gold)}
.game-header .gh-left p{font-size:.75rem;color:var(--muted);margin-top:1px}
.gh-btns{display:flex;gap:8px;align-items:center}
.gh-btn{padding:6px 14px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:transparent;color:var(--text);font-size:.8rem;cursor:pointer;transition:all .15s}
.gh-btn:hover{border-color:var(--gold);color:var(--gold)}

.game-body{display:flex;flex:1;overflow:hidden;gap:0}
@media(max-width:900px){.game-body{flex-direction:column;overflow-y:auto}}

/* ── BOARD ── */
.board-wrap{flex:1;padding:12px;display:flex;align-items:center;justify-content:center;min-height:0;overflow:auto}
/* ── 大富翁環狀棋盤（橫向 3:2，上下 12 格，左右 8 格含角） ── */
/* 以螢幕高度為基準決定尺寸，讓左右欄格子取得足夠高度 */
.board{display:grid;grid-template-columns:1.6fr repeat(10,1fr) 1.6fr;grid-template-rows:repeat(8,1fr);gap:3px;width:min(96vw,calc((100dvh - 72px) * 3 / 2),1140px);aspect-ratio:3/2}
.board-center{grid-column:2/12;grid-row:2/8;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;background:radial-gradient(ellipse at center,#1a3a6e 0%,#0f3460 60%,#0a2040 100%);border-radius:10px;border:2px solid rgba(246,201,14,.35);text-align:center;gap:6px;padding:10px 8px;overflow-y:auto;overflow-x:hidden;box-shadow:inset 0 0 40px rgba(0,0,0,.4)}
.sq{border-radius:6px;padding:2px 2px 22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;cursor:default;border:2px solid rgba(255,255,255,.1);transition:all .2s;min-width:0;overflow:hidden}
.sq:hover{border-color:rgba(255,255,255,.4);transform:scale(1.04);z-index:5}
.sq-corner{border-color:rgba(246,201,14,.45)!important;box-shadow:0 0 8px rgba(246,201,14,.25)}
/* 左右欄格子（6格，每格較高）：稍縮以保留空間 */
.sq-side{padding-bottom:18px}
.sq-side .sq-num{font-size:.65rem;top:2px;left:3px}
.sq-side .sq-emoji{font-size:.85rem;margin-top:5px;margin-bottom:1px}
.sq-side .sq-name{font-size:.5rem;line-height:1.15}
.sq-side .sq-tokens{min-height:16px}
.sq .sq-num{position:absolute;top:2px;left:4px;font-size:1.1rem;font-weight:700;opacity:.75;line-height:1}
.sq .sq-emoji{font-size:2.2rem;line-height:1;margin-top:14px;margin-bottom:2px}
.sq .sq-name{font-size:1rem;text-align:center;line-height:1.15;opacity:.9;font-weight:700;word-break:keep-all}
/* Token strip 固定在格子底部 */
.sq .sq-tokens{position:absolute;bottom:0;left:0;right:0;min-height:20px;display:flex;gap:2px;flex-wrap:wrap;justify-content:center;align-items:center;padding:2px;border-radius:0 0 4px 4px;border-top:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.3)}
.sq .sq-tokens:empty{background:rgba(0,0,0,.12);border-top-color:rgba(255,255,255,.05)}
/* Token 圓形棋子：每組不同顏色邊框 */
.token{width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6rem;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 2px 5px rgba(0,0,0,.7);background:rgba(8,12,25,.9);flex-shrink:0;transition:transform .15s}
.token:hover{transform:scale(1.2);z-index:5}
.sq.highlight-move{animation:sqpulse .4s ease}
@keyframes sqpulse{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.sq.current-sq{box-shadow:0 0 0 3px var(--gold),0 0 12px rgba(246,201,14,.5)}

/* Square type colors */
.sq-start{background:linear-gradient(135deg,#276749,#38a169)}
.sq-end  {background:linear-gradient(135deg,#744210,#c05621)}
.sq-task {background:linear-gradient(135deg,#1a365d,#2b6cb0)}
.sq-song {background:linear-gradient(135deg,#652b19,#c05621)}
.sq-riddle{background:linear-gradient(135deg,#44337a,#6b46c1)}
.sq-chance{background:linear-gradient(135deg,#744210,#d69e2e)}
.sq-fortune{background:linear-gradient(135deg,#742a2a,#c53030)}
.sq-rest {background:linear-gradient(135deg,#2d3748,#4a5568)}

/* ── SIDE PANEL ── */
.side{width:200px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.08);background:var(--bg2);overflow-y:auto;padding:10px}
@media(max-width:900px){.side{width:100%;border-left:none;border-top:1px solid rgba(255,255,255,.08)}}

/* board-center 裡的計分 */
.bc-title{font-size:.7rem;font-weight:900;color:var(--gold);letter-spacing:2px;opacity:.7;margin-bottom:2px}
.board-center .turn-banner{width:100%;margin-bottom:0;padding:7px 10px;box-sizing:border-box}
.board-center .turn-banner .tb-team{font-size:1rem}
.board-center .dice-area{gap:4px;margin-bottom:0}
.board-center .dice-scene{width:70px;height:70px}
.board-center .dice{width:62px;height:62px}
.board-center .die-face{width:62px;height:62px}
.board-center .face-front{transform:translateZ(31px)}
.board-center .face-back {transform:rotateY(180deg) translateZ(31px)}
.board-center .face-right{transform:rotateY(90deg) translateZ(31px)}
.board-center .face-left {transform:rotateY(-90deg) translateZ(31px)}
.board-center .face-top  {transform:rotateX(-90deg) translateZ(31px)}
.board-center .face-bottom{transform:rotateX(90deg) translateZ(31px)}
.board-center .dice-result-num{font-size:1.8rem;min-height:2.2rem}
.board-center .btn-roll{padding:8px 22px;font-size:.85rem}
.board-center .scoreboard{width:100%;margin-bottom:0;padding:7px 8px;box-sizing:border-box}
.board-center .scoreboard h4{margin-bottom:6px;font-size:.65rem}
.board-center .score-row{padding:4px 6px}
.board-center .sr-emoji{font-size:1rem;width:22px}
.board-center .sr-name{font-size:.75rem}
.board-center .sr-pos{font-size:.62rem}
.board-center .sr-score{font-size:.9rem}

/* Current turn banner */
.turn-banner{background:linear-gradient(135deg,rgba(246,201,14,.12),rgba(246,201,14,.06));border:1px solid rgba(246,201,14,.3);border-radius:10px;padding:12px;text-align:center;margin-bottom:14px}
.turn-banner .tb-label{font-size:.72rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.turn-banner .tb-team{font-size:1.3rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.turn-banner .tb-skip{font-size:.78rem;color:var(--red);background:rgba(252,129,129,.12);border-radius:20px;padding:2px 10px;margin-top:4px;display:inline-block}

/* Dice area */
.dice-area{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:14px}
.dice-scene{perspective:600px;width:90px;height:90px;display:flex;align-items:center;justify-content:center}
.dice{width:80px;height:80px;position:relative;transform-style:preserve-3d;transform:rotateX(0deg) rotateY(0deg);transition:transform 0.1s}
.dice.rolling{animation:diceroll 1.4s ease-in-out forwards}
@keyframes diceroll{
  0%  {transform:rotateX(0deg) rotateY(0deg)}
  15% {transform:rotateX(180deg) rotateY(90deg)}
  30% {transform:rotateX(360deg) rotateY(270deg)}
  50% {transform:rotateX(180deg) rotateY(540deg)}
  70% {transform:rotateX(540deg) rotateY(360deg)}
  85% {transform:rotateX(720deg) rotateY(630deg)}
  100%{transform:var(--dice-final,rotateX(0deg) rotateY(0deg))}
}
.die-face{position:absolute;width:80px;height:80px;border-radius:12px;background:#d32f2f;border:3px solid #8b0000;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;box-shadow:inset 0 0 10px rgba(0,0,0,.3)}
.face-front {transform:translateZ(40px)}
.face-back  {transform:rotateY(180deg) translateZ(40px)}
.face-right {transform:rotateY(90deg) translateZ(40px)}
.face-left  {transform:rotateY(-90deg) translateZ(40px)}
.face-top   {transform:rotateX(-90deg) translateZ(40px)}
.face-bottom{transform:rotateX(90deg) translateZ(40px)}
.pips{position:relative;width:56px;height:56px}
.pip{width:12px;height:12px;background:#fff;border-radius:50%;position:absolute;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.pip.c {top:50%;left:50%;transform:translate(-50%,-50%)}
.pip.tl{top:4px;left:4px}
.pip.tr{top:4px;right:4px}
.pip.ml{top:50%;left:4px;transform:translateY(-50%)}
.pip.mr{top:50%;right:4px;transform:translateY(-50%)}
.pip.bl{bottom:4px;left:4px}
.pip.br{bottom:4px;right:4px}

.dice-result-num{font-size:2.5rem;font-weight:900;color:var(--gold);text-shadow:0 0 20px rgba(246,201,14,.6);min-height:3rem;display:flex;align-items:center;justify-content:center}
.btn-roll{padding:12px 32px;background:linear-gradient(135deg,#c53030,#e53e3e);border:none;border-radius:30px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(229,62,62,.4);transition:all .2s;letter-spacing:1px}
.btn-roll:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 22px rgba(229,62,62,.5)}
.btn-roll:disabled{opacity:.4;cursor:not-allowed;transform:none}

/* Scoreboard */
.scoreboard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px;margin-bottom:14px}
.scoreboard h4{font-size:.75rem;color:var(--muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.score-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;margin-bottom:4px;transition:background .2s;border-left:4px solid transparent}
.score-row.is-current{background:rgba(246,201,14,.1);outline:1px solid rgba(246,201,14,.3)}
.score-row .sr-emoji{font-size:1.3rem;width:28px;text-align:center}
.score-row .sr-info{flex:1;min-width:0}
.score-row .sr-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-row .sr-pos{font-size:.72rem;color:var(--muted)}
.score-row .sr-score{font-size:1.05rem;font-weight:800;color:var(--gold)}

/* History log */
.game-log{flex:1;min-height:0}
.game-log h4{font-size:.75rem;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.log-list{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px;max-height:120px;overflow-y:auto}
.log-item{padding:4px 8px;background:rgba(255,255,255,.04);border-radius:6px;line-height:1.4}

/* ── MODALS ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.hidden{display:none}
.modal{background:var(--bg2);border:1px solid rgba(255,255,255,.15);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-head{padding:20px 20px 0;text-align:center}
.modal-head .mh-emoji{font-size:3rem;line-height:1;margin-bottom:8px}
.modal-head .mh-badge{display:inline-block;padding:3px 14px;border-radius:20px;font-size:.75rem;font-weight:700;margin-bottom:8px;letter-spacing:1px}
.modal-head h2{font-size:1.3rem;font-weight:800;margin-bottom:6px}
.modal-head .mh-team{font-size:.85rem;color:var(--muted);margin-bottom:0}
.modal-body{padding:16px 20px}
.modal-desc{background:rgba(255,255,255,.06);border-radius:10px;padding:14px;font-size:.95rem;line-height:1.7;white-space:pre-wrap;margin-bottom:12px;border:1px solid rgba(255,255,255,.1)}
.modal-pts{text-align:center;font-size:.85rem;color:var(--gold);margin-bottom:16px}
.modal-pts span{font-size:1.2rem;font-weight:800}
.modal-actions{display:flex;gap:10px}
.btn-complete{flex:1;padding:13px;background:linear-gradient(135deg,#276749,#38a169);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:700;cursor:pointer;transition:all .2s}
.btn-complete:hover{filter:brightness(1.1)}
.btn-skip{flex:1;padding:13px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:10px;color:var(--muted);font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s}
.btn-skip:hover{border-color:rgba(255,255,255,.4);color:var(--text)}
.task-timer{text-align:center;margin-bottom:12px}
.timer-display{font-size:2rem;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
.timer-display.warn{color:var(--red);animation:blink .5s ease infinite alternate}
@keyframes blink{from{opacity:1}to{opacity:.4}}
.timer-btns{display:flex;gap:8px;justify-content:center;margin-top:6px}
.timer-btn{padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--muted);font-size:.78rem;cursor:pointer;transition:all .15s}
.timer-btn:hover{border-color:var(--gold);color:var(--gold)}

/* Card modal */
.card-modal .modal{border:2px solid}
.card-modal.chance-modal .modal{border-color:var(--gold);box-shadow:0 0 40px rgba(246,201,14,.3)}
.card-modal.fortune-modal .modal{border-color:var(--red);box-shadow:0 0 40px rgba(252,129,129,.3)}
.card-content{background:rgba(255,255,255,.06);border-radius:12px;padding:20px;text-align:center;margin:16px 20px;font-size:1.05rem;line-height:1.7;white-space:pre-wrap;font-weight:600;border:1px solid rgba(255,255,255,.1)}
.card-effect{text-align:center;font-size:.85rem;color:var(--muted);margin:0 20px 16px;padding:8px;background:rgba(255,255,255,.04);border-radius:8px}
.btn-card-ok{display:block;width:calc(100% - 40px);margin:0 20px 20px;padding:13px;background:linear-gradient(135deg,#f6c90e,#ed8936);border:none;border-radius:10px;color:#1a1a2e;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s}
.btn-card-ok:hover{filter:brightness(1.05)}

/* Settings modal */
.settings-form{padding:0 20px 20px}
.settings-form label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;margin-top:12px}
.settings-form .field-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15)}
.settings-form .hint{font-size:.74rem;color:var(--muted);margin-top:5px;line-height:1.5}
.settings-btns{display:flex;gap:8px;margin-top:16px}
.btn-save-settings{flex:1;padding:10px;background:linear-gradient(135deg,#f6c90e,#ed8936);border:none;border-radius:8px;color:#1a1a2e;font-weight:700;font-size:.9rem;cursor:pointer}
.btn-cancel-modal{padding:10px 20px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:transparent;color:var(--muted);font-size:.9rem;cursor:pointer}

/* Save modal */
.save-form{padding:0 20px 20px}
.save-form label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:5px;margin-top:12px}
.save-status{text-align:center;padding:10px;font-size:.9rem;margin-top:10px;border-radius:8px}
.save-status.ok{background:rgba(104,211,145,.15);color:var(--green)}
.save-status.err{background:rgba(252,129,129,.15);color:var(--red)}

/* Notification toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:30px;font-size:.88rem;font-weight:600;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* GAMEOVER */
#gameover{background:radial-gradient(ellipse at top,#1a1a2e 0%,#0f3460 100%);align-items:center;justify-content:center;padding:20px;text-align:center}
.go-box{max-width:480px;width:100%}
.go-trophy{font-size:5rem;line-height:1;margin-bottom:16px;animation:bounce 1s ease infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-12px)}}
.go-title{font-size:2rem;font-weight:900;color:var(--gold);margin-bottom:6px}
.go-sub{font-size:.95rem;color:var(--muted);margin-bottom:30px}
.rankings{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:16px;margin-bottom:24px}
.rankings h3{font-size:.85rem;color:var(--muted);margin-bottom:14px;text-transform:uppercase;letter-spacing:1px}
.rank-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:10px;margin-bottom:6px}
.rank-row:nth-child(2){background:rgba(246,201,14,.12);border:1px solid rgba(246,201,14,.3)}
.rank-row:nth-child(3){background:rgba(192,192,192,.08)}
.rank-row:nth-child(4){background:rgba(205,127,50,.08)}
.rank-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;flex-shrink:0}
.rank-row:nth-child(2) .rank-num{background:var(--gold);color:#1a1a2e}
.rank-row:nth-child(3) .rank-num{background:#aaa;color:#fff}
.rank-row:nth-child(4) .rank-num{background:#cd7f32;color:#fff}
.rank-row .rank-emoji{font-size:1.6rem;width:32px}
.rank-row .rank-info{flex:1;text-align:left}
.rank-row .rank-name{font-weight:700;font-size:.95rem}
.rank-row .rank-detail{font-size:.75rem;color:var(--muted)}
.rank-row .rank-score{font-size:1.3rem;font-weight:900;color:var(--gold)}
.go-btns{display:flex;flex-direction:column;gap:10px}
.btn-newgame{padding:14px;background:linear-gradient(135deg,#f6c90e,#ed8936);border:none;border-radius:var(--radius);color:#1a1a2e;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s}
.btn-newgame:hover{filter:brightness(1.05)}
.btn-again{padding:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:var(--radius);color:var(--text);font-size:.95rem;cursor:pointer}

/* Card flip animation */
.card-flip-wrap{perspective:600px;width:160px;height:220px;margin:16px auto}
.card-flip{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .7s ease}
.card-flip.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.card-front{background:linear-gradient(135deg,#2d3748,#4a5568);border:2px solid rgba(255,255,255,.15)}
.card-front .cf-emoji{font-size:3rem}
.card-front .cf-label{font-size:1rem;font-weight:700}
.card-back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a365d,#2b6cb0);border:2px solid rgba(99,179,237,.4)}
.card-back.chance-back{background:linear-gradient(135deg,#744210,#d69e2e);border-color:rgba(246,201,14,.4)}
.card-back.fortune-back{background:linear-gradient(135deg,#742a2a,#c53030);border-color:rgba(252,129,129,.4)}
.card-back .cb-emoji{font-size:2.5rem}
.card-back .cb-text{font-size:.88rem;font-weight:700;text-align:center;padding:0 12px;line-height:1.5}

/* Mobile tweaks */
@media(max-width:900px){
  .board-wrap{min-height:0}
  .board{width:min(98vw,calc((100dvh - 140px) * 3/2))}
  .sq .sq-emoji{font-size:1.3rem}
  .sq .sq-name{font-size:.6rem}
  .sq .sq-num{font-size:.65rem}
  .board-center{gap:4px}
}
@media(max-width:600px){
  .sq .sq-emoji{font-size:.9rem}
  .sq .sq-name{font-size:.44rem}
  .sq .sq-tokens{min-height:14px}
  .token{width:13px;height:13px;font-size:.5rem;border-width:2px}
}
@media(max-width:480px){
  .game-logo h1{font-size:1.8rem}
  .setup-section{padding:14px}
  .modal{border-radius:12px}
  .side{padding:10px}
}
</style>
</head>
<body>

<!-- ══════════════════════════════════
     SETUP SCREEN
══════════════════════════════════ -->
<div id="setup" class="screen active">
<div class="setup-box">
  <div class="game-logo">
    <h1>🎲 台語大富翁</h1>
    <p>台語課互動遊戲　－　說台語、學文化、玩得開心！</p>
  </div>

  <div class="setup-section">
    <h3>基本設定</h3>
    <div class="field-row">
      <label>班　級</label>
      <div class="class-btns">
        <button class="class-btn sel" data-cls="701" onclick="selectClass('701')">701 班</button>
        <button class="class-btn" data-cls="702" onclick="selectClass('702')">702 班</button>
      </div>
    </div>
    <div class="field-row">
      <label>組別數</label>
      <div class="team-count-btns">
        <button class="count-btn sel" onclick="setTeamCount(1)">1</button>
        <button class="count-btn" onclick="setTeamCount(2)">2</button>
        <button class="count-btn" onclick="setTeamCount(3)">3</button>
        <button class="count-btn" onclick="setTeamCount(4)">4</button>
      </div>
    </div>
  </div>

  <div class="setup-section">
    <h3>各組設定</h3>
    <div class="team-cards" id="team-cards"></div>
  </div>

  <div class="load-section" id="load-section" style="display:none">
    <h3>📂 讀取上次進度</h3>
    <div class="save-list" id="save-list"></div>
  </div>

  <button class="btn-start" onclick="startGame()">🚀 開始遊戲！</button>
</div>
</div>

<!-- ══════════════════════════════════
     GAME SCREEN
══════════════════════════════════ -->
<div id="game" class="screen">
  <div class="game-header">
    <div class="gh-left">
      <h2 id="gh-class">台語大富翁</h2>
      <p id="gh-sub">導師操作模式</p>
    </div>
    <div class="gh-btns">
      <button class="gh-btn" onclick="openSaveModal()">💾 儲存進度</button>
      <button class="gh-btn" onclick="openSettingsModal()">⚙ 設定</button>
      <button class="gh-btn" onclick="if(confirm('確定要返回設定畫面？'))location.reload()">← 返回</button>
    </div>
  </div>

  <div class="game-body">
    <!-- Board（中央面板嵌在棋盤內） -->
    <div class="board-wrap">
      <div class="board" id="board">
        <!-- 棋盤中央：回合、骰子、計分 -->
        <div class="board-center" id="board-center">
          <div class="bc-title">台語大富翁</div>
          <!-- Current turn -->
          <div class="turn-banner" id="turn-banner">
            <div class="tb-label">目前輪到</div>
            <div class="tb-team" id="tb-team">－</div>
            <div class="tb-skip" id="tb-skip" style="display:none"></div>
          </div>
          <!-- Dice -->
          <div class="dice-area">
            <div class="dice-scene">
              <div class="dice" id="dice">
                <div class="die-face face-front">
                  <div class="pips"><div class="pip c"></div></div>
                </div>
                <div class="die-face face-right">
                  <div class="pips"><div class="pip tl"></div><div class="pip br"></div></div>
                </div>
                <div class="die-face face-top">
                  <div class="pips"><div class="pip tl"></div><div class="pip c"></div><div class="pip br"></div></div>
                </div>
                <div class="die-face face-back" style="background:#b71c1c">
                  <div class="pips"><div class="pip tl"></div><div class="pip tr"></div><div class="pip ml"></div><div class="pip mr"></div></div>
                </div>
                <div class="die-face face-left" style="background:#c62828">
                  <div class="pips"><div class="pip tl"></div><div class="pip br"></div><div class="pip tr"></div><div class="pip bl"></div><div class="pip c"></div></div>
                </div>
                <div class="die-face face-bottom" style="background:#b71c1c">
                  <div class="pips"><div class="pip tl"></div><div class="pip br"></div><div class="pip tr"></div><div class="pip bl"></div><div class="pip ml"></div><div class="pip mr"></div></div>
                </div>
              </div>
            </div>
            <div class="dice-result-num" id="dice-num">🎲</div>
            <button class="btn-roll" id="roll-btn" onclick="rollDice()">擲　骰　子</button>
          </div>
          <!-- Scoreboard -->
          <div class="scoreboard">
            <h4>積分排名</h4>
            <div id="scoreboard"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Side panel：只留遊戲記錄 -->
    <div class="side">
      <div class="game-log" style="flex:1">
        <h4>遊戲記錄</h4>
        <div class="log-list" id="log-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     GAME OVER SCREEN
══════════════════════════════════ -->
<div id="gameover" class="screen">
  <div class="go-box">
    <div class="go-trophy">🏆</div>
    <div class="go-title" id="go-title">遊戲結束！</div>
    <div class="go-sub" id="go-sub">感謝大家的精彩表現！</div>
    <div class="rankings" id="go-rankings"></div>
    <div class="go-btns">
      <button class="btn-again" onclick="restartGame()">🔁 同班再玩一次</button>
      <button class="btn-newgame" onclick="location.reload()">🏠 返回首頁</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     MODALS
══════════════════════════════════ -->

<!-- Task Modal -->
<div class="modal-overlay hidden" id="task-modal-overlay">
  <div class="modal">
    <div class="modal-head">
      <div class="mh-emoji" id="tm-emoji"></div>
      <div class="mh-badge" id="tm-badge"></div>
      <h2 id="tm-title"></h2>
      <p class="mh-team" id="tm-team"></p>
    </div>
    <div class="modal-body">
      <div class="task-timer" id="task-timer" style="display:none">
        <div class="timer-display" id="timer-display">60</div>
        <div class="timer-btns">
          <button class="timer-btn" onclick="startTimer(60)">60秒</button>
          <button class="timer-btn" onclick="startTimer(30)">30秒</button>
          <button class="timer-btn" onclick="stopTimer()">停止</button>
        </div>
      </div>
      <div class="modal-desc" id="tm-desc"></div>
      <div class="modal-pts" id="tm-pts"></div>
      <div class="modal-actions">
        <button class="btn-complete" onclick="completeTask()">✓ 答對！留在此格</button>
        <button class="btn-skip" onclick="skipTask()">✗ 答錯！退回</button>
      </div>
    </div>
  </div>
</div>

<!-- Card Modal -->
<div class="modal-overlay hidden card-modal" id="card-modal-overlay">
  <div class="modal">
    <div class="modal-head" style="padding-top:20px">
      <div class="mh-badge" id="cm-badge"></div>
      <h2 id="cm-title"></h2>
    </div>
    <div class="card-flip-wrap">
      <div class="card-flip" id="card-flip">
        <div class="card-face card-front">
          <div class="cf-emoji" id="cf-emoji">🃏</div>
          <div class="cf-label" id="cf-label">翻開看看</div>
        </div>
        <div class="card-face card-back" id="card-back">
          <div class="cb-emoji" id="cb-emoji"></div>
          <div class="cb-text" id="cb-text"></div>
        </div>
      </div>
    </div>
    <div class="card-content" id="cm-content" style="display:none"></div>
    <div class="card-effect" id="cm-effect" style="display:none"></div>
    <div id="cm-team-pick" style="display:none;padding:0 20px 16px">
      <div style="font-size:.8rem;color:var(--muted);text-align:center;margin-bottom:8px">選擇要贈送的組別：</div>
      <div id="cm-team-pick-btns" style="display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <button class="btn-card-ok" id="cm-ok" onclick="confirmCard()" style="display:none">確認，繼續遊戲</button>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay hidden" id="settings-modal-overlay">
  <div class="modal">
    <div class="modal-head" style="padding-top:20px">
      <h2>⚙ 遊戲設定</h2>
    </div>
    <div class="settings-form">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:4px">
        <input type="checkbox" id="cfg-sound" style="accent-color:var(--gold);width:16px;height:16px">
        <span style="font-size:.88rem;color:var(--text)">音效</span>
      </label>
      <label style="margin-top:10px;display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="cfg-timer" style="accent-color:var(--gold);width:16px;height:16px">
        <span style="font-size:.88rem;color:var(--text)">自動顯示計時器</span>
      </label>
      <div class="settings-btns">
        <button class="btn-save-settings" onclick="saveSettings()">儲存設定</button>
        <button class="btn-cancel-modal" onclick="closeAllModals()">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- Save Modal -->
<div class="modal-overlay hidden" id="save-modal-overlay">
  <div class="modal">
    <div class="modal-head" style="padding-top:20px">
      <h2>💾 儲存進度</h2>
    </div>
    <div class="save-form">
      <label>儲存名稱</label>
      <input class="field-input" id="save-name" type="text" placeholder="例如：第一節課">
      <div id="save-status"></div>
      <div class="settings-btns" style="margin-top:16px">
        <button class="btn-save-settings" onclick="doSave()">儲存</button>
        <button class="btn-cancel-modal" onclick="closeAllModals()">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- Bonus Task Modal (from Fortune card) -->
<div class="modal-overlay hidden" id="bonus-modal-overlay">
  <div class="modal">
    <div class="modal-head" style="padding-top:20px">
      <div class="mh-emoji">🎤</div>
      <h2>特別任務！</h2>
      <p class="mh-team" id="bm-team"></p>
    </div>
    <div class="modal-body">
      <div class="modal-desc">現在用台語唱一句歌詞！\n成功完成可獲得 20 分！</div>
      <div class="modal-actions" style="margin-top:12px">
        <button class="btn-complete" onclick="completeBonusTask()">✓ 唱出來了！+20分</button>
        <button class="btn-skip" onclick="skipBonusTask()">✗ 跳過</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

let setupTeamCount = 1;
let setupClass = '701';
const setupTeams = [{name:'第一組',charId:'rabbit'},{name:'第二組',charId:'cat'},{name:'第三組',charId:'mouse'},{name:'第四組',charId:'monkey'}];

function initSetup() {
  setTeamCount(2);
  selectClass('701');
  loadLocalSaves();
}

function selectClass(cls) {
  setupClass = cls;
  document.querySelectorAll('.class-btn').forEach(b => b.classList.toggle('sel', b.dataset.cls === cls));
}

function setTeamCount(n) {
  setupTeamCount = n;
  document.querySelectorAll('.count-btn').forEach((b,i) => b.classList.toggle('sel', i+1 === n));
  renderTeamCards();
}

function renderTeamCards() {
  const el = document.getElementById('team-cards');
  el.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const t = setupTeams[i];
    const hidden = i >= setupTeamCount;
    const div = document.createElement('div');
    div.className = 'team-card' + (hidden ? ' hidden' : '');
    div.id = `tc-${i}`;
    div.style.borderColor = hidden ? '' : TEAM_COLORS[i];
    // chars used by OTHER active teams
    const takenIds = setupTeams
      .filter((_, idx) => idx !== i && idx < setupTeamCount)
      .map(t => t.charId);
    div.innerHTML = `
      <div class="team-card-header">
        <div class="team-dot" style="background:${TEAM_COLORS[i]}"></div>
        <input class="team-name-input" value="${t.name}" oninput="setupTeams[${i}].name=this.value" placeholder="組別名稱">
      </div>
      <div style="font-size:.75rem;color:var(--muted);margin-bottom:6px">選擇角色</div>
      <div class="char-grid" id="cg-${i}">
        ${CHARS.map(c => {
          const taken = takenIds.includes(c.id);
          const sel = t.charId === c.id;
          const selStyle = sel
            ? `border-color:${TEAM_COLORS[i]};background:${TEAM_COLORS[i]}28;box-shadow:0 0 0 2px ${TEAM_COLORS[i]}66`
            : '';
          return `<div class="char-opt${sel?' sel':''}${taken?' char-taken':''}"
            style="${selStyle}"
            title="${taken?'已被其他組選走':'選擇 '+c.name}"
            onclick="selectChar(${i},'${c.id}')">
            <div class="ce">${c.emoji}</div>
            <div class="cn">${c.name}</div>
            ${taken?'<div class="char-x">✗</div>':''}
          </div>`;
        }).join('')}
      </div>`;
    el.appendChild(div);
  }
}

function selectChar(teamIdx, charId) {
  const takenBy = setupTeams.findIndex((t, i) => i !== teamIdx && i < setupTeamCount && t.charId === charId);
  if (takenBy >= 0) {
    toast(`${CHARS.find(c=>c.id===charId)?.emoji} 已被第 ${takenBy+1} 組選走了！`);
    return;
  }
  setupTeams[teamIdx].charId = charId;
  renderTeamCards();
}

function loadLocalSaves() {
  const saves = getLocalSaves();
  const section = document.getElementById('load-section');
  const list = document.getElementById('save-list');
  if (saves.length === 0) { section.style.display = 'none'; return; }
  section.style.display = '';
  list.innerHTML = saves.map((s, i) => `
    <div class="save-item">
      <div class="si-info">
        <span class="si-name">${esc(s.name)} - ${esc(s.classId)}</span>
        <span class="si-time">${s.time}</span>
      </div>
      <button class="si-resume" onclick="resumeSave(${i})">繼續</button>
    </div>`).join('');
}

function getLocalSaves() {
  try { return JSON.parse(localStorage.getItem('tl_saves') || '[]'); } catch(e) { return []; }
}

function resumeSave(idx) {
  const saves = getLocalSaves();
  if (!saves[idx]) return;
  const state = saves[idx].state;
  G.classId    = state.classId;
  G.teams      = state.teams;
  G.currentTeam = state.currentTeam;
  G.squares    = state.squares || [...SQUARES];
  G.log        = state.log || [];
  G.squareQuestionsUsed = state.squareQuestionsUsed || {};
  G.prevPos = state.prevPos || 1;
  G.phase      = 'roll';
  G.rolling    = false;
  G.pendingCard = null;
  closeAllModals();
  showScreen('game');
  document.getElementById('gh-class').textContent = `🎲 台語大富翁 - ${G.classId}`;
  document.getElementById('roll-btn').disabled = false;
  renderBoard();
  renderTokens();
  renderScoreboard();
  renderLog();
  updateTurnBanner();
}

function startGame() {
  const classId = setupClass;
  G.classId = classId;
  G.teamCount = setupTeamCount;
  G.teams = [];
  for (let i = 0; i < setupTeamCount; i++) {
    const t = setupTeams[i];
    const char = CHARS.find(c => c.id === t.charId) || CHARS[i];
    G.teams.push({
      name: t.name || `第${i+1}組`,
      char: char,
      color: TEAM_COLORS[i],
      pos: 1,
      score: 0,
      skipTurns: 0,
      finished: false,
    });
  }
  G.currentTeam = 0;
  G.phase = 'roll';
  G.rolling = false;
  G.prevPos = 1;
  G.log = [];
  G.squareQuestionsUsed = {};
  document.getElementById('gh-class').textContent = `🎲 台語大富翁 - ${classId}`;
  showScreen('game');
  renderBoard();
  renderTokens();
  renderScoreboard();
  renderLog();
  updateTurnBanner();
  if (APPS_SCRIPT_URL) loadQuestionsFromSheets();
}

// ══════════════════════════════════
//  BOARD
// ══════════════════════════════════

function getGridPos(n) {
  // 橫向長方形（3:2）環狀排列，起點在右下角
  // 底列右→左(n=1~12)、左欄下→上(n=13~18)、頂列左→右(n=19~30)、右欄上→下(n=31~36)
  if (n <= 12)  return { gridRow: 8, gridCol: 13 - n };
  if (n <= 18)  return { gridRow: 8 - (n - 12), gridCol: 1 };
  if (n <= 30)  return { gridRow: 1,  gridCol: n - 18 };
  return             { gridRow: n - 29, gridCol: 12 };
}

function renderBoard() {
  const board = document.getElementById('board');
  // 只移除格子，保留中央面板
  board.querySelectorAll('.sq').forEach(el => el.remove());
  const CORNERS = new Set([1, 12, 19, 30]);
  const SIDES   = new Set([13,14,15,16,17,18, 31,32,33,34,35,36]);
  G.squares.forEach(sq => {
    const {gridRow, gridCol} = getGridPos(sq.n);
    const div = document.createElement('div');
    div.className = `sq sq-${sq.type}${CORNERS.has(sq.n) ? ' sq-corner' : ''}${SIDES.has(sq.n) ? ' sq-side' : ''}`;
    div.id = `sq-${sq.n}`;
    div.style.gridRow = gridRow;
    div.style.gridColumn = gridCol;
    div.style.background = sq.color ? `linear-gradient(135deg,${darken(sq.color)},${sq.color})` : '';
    div.innerHTML = `
      <div class="sq-num">${sq.n}</div>
      <div class="sq-emoji">${sq.emoji}</div>
      <div class="sq-name">${sq.name}</div>
      <div class="sq-tokens" id="tokens-${sq.n}"></div>`;
    div.onclick = () => showSquareInfo(sq.n);
    board.appendChild(div);
  });
}

function darken(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-40)},${Math.max(0,g-40)},${Math.max(0,b-40)})`;
}

function renderTokens() {
  document.querySelectorAll('.sq-tokens').forEach(el => el.innerHTML = '');
  G.teams.forEach((team, i) => {
    const el = document.getElementById(`tokens-${team.pos}`);
    if (!el) return;
    const tok = document.createElement('div');
    tok.className = 'token';
    tok.style.borderColor = team.color;
    tok.style.boxShadow = `0 0 0 1px rgba(0,0,0,.6), 0 0 6px ${team.color}88, 0 2px 5px rgba(0,0,0,.7)`;
    tok.textContent = team.char.emoji;
    tok.title = `${team.name}（第${team.pos}格）`;
    // 目前輪到的玩家加大
    if (i === G.currentTeam) {
      tok.style.transform = 'scale(1.2)';
      tok.style.zIndex = '3';
    }
    el.appendChild(tok);
  });
}

function highlightSquare(n) {
  document.querySelectorAll('.sq').forEach(s => s.classList.remove('highlight-move','current-sq'));
  const el = document.getElementById(`sq-${n}`);
  if (el) { el.classList.add('highlight-move'); setTimeout(()=>el.classList.add('current-sq'),350); }
}

function showSquareInfo(n) {
  const sq = G.squares.find(s => s.n === n);
  if (!sq) return;
  toast(`${sq.emoji} 第${n}格：${sq.name}`);
}

// ══════════════════════════════════
//  DICE
// ══════════════════════════════════

// Face orientations: value → CSS transform to face viewer
const DICE_ORIENTATIONS = {
  1: 'rotateX(0deg) rotateY(0deg)',       // front face
  2: 'rotateX(0deg) rotateY(-90deg)',     // right face toward viewer (rotate left)
  3: 'rotateX(-90deg) rotateY(0deg)',     // top face toward viewer (rotate down)
};

function rollDice() {
  if (G.rolling || G.phase !== 'roll') return;
  const team = G.teams[G.currentTeam];
  if (team.skipTurns > 0) {
    team.skipTurns--;
    addLog(`${team.char.emoji} ${team.name} 跳過本回合`);
    nextTurn();
    return;
  }
  G.prevPos = team.pos;
  G.rolling = true;
  document.getElementById('roll-btn').disabled = true;
  playSound('roll');
  const result = Math.floor(Math.random() * 3) + 1;
  const dice = document.getElementById('dice');
  const finalTransform = DICE_ORIENTATIONS[result];
  dice.style.setProperty('--dice-final', finalTransform);
  dice.style.transition = 'none';
  dice.style.transform = 'rotateX(0deg) rotateY(0deg)';
  void dice.offsetWidth;
  dice.classList.add('rolling');
  dice.addEventListener('animationend', function handler() {
    dice.classList.remove('rolling');
    dice.style.transition = 'transform .3s ease';
    dice.style.transform = finalTransform;
    dice.removeEventListener('animationend', handler);
    document.getElementById('dice-num').textContent = result;
    addLog(`${team.char.emoji} ${team.name} 擲出 ${result} 點`);
    setTimeout(() => {
      playSound('land');
      movePlayer(result);
    }, 400);
  }, {once: true});
}

// ══════════════════════════════════
//  GAME LOGIC
// ══════════════════════════════════

function movePlayer(steps) {
  const team = G.teams[G.currentTeam];
  const newPos = Math.min(team.pos + steps, 36);
  let current = team.pos;
  const interval = setInterval(() => {
    current = Math.min(current + 1, newPos);
    team.pos = current;
    renderTokens();
    highlightSquare(current);
    if (current >= newPos) {
      clearInterval(interval);
      G.rolling = false;
      renderScoreboard();
      setTimeout(() => landOnSquare(current), 300);
    }
  }, 350);
}

function landOnSquare(n, fromCard = false) {
  const sq = G.squares.find(s => s.n === n);
  if (!sq) { nextTurn(); return; }
  const team = G.teams[G.currentTeam];
  addLog(`${team.char.emoji} ${team.name} 抵達第 ${n} 格：${sq.name}`);

  if (sq.type === 'chance') {
    setTimeout(() => drawCard('chance'), 400);
  } else if (sq.type === 'fortune') {
    setTimeout(() => drawCard('fortune'), 400);
  } else if (sq.type === 'rest') {
    team.skipTurns = 1;
    addLog(`😴 ${team.name} 休息一回合`);
    showNotification(`😴 ${team.name} 休息一回合！`);
    setTimeout(nextTurn, 2000);
  } else if (sq.type === 'start') {
    setTimeout(nextTurn, 800);
  } else if (sq.type === 'end') {
    team.finished = true;
    addLog(`🏆 ${team.name} 到達終點，獲勝！`);
    playSound('win');
    renderScoreboard();
    renderTokens();
    setTimeout(showGameOver, 1200);
  } else {
    // task, song, riddle — 卡片移動不需答題
    if (fromCard) {
      setTimeout(nextTurn, 800);
    } else {
      G.phase = 'task';
      setTimeout(() => showTaskModal(sq), 500);
    }
  }
}

// ── Pick question variant (rotate through pool, no repeat until all used) ──
function pickQuestion(sq) {
  if (!sq.questions || sq.questions.length === 0) return sq.desc || '';
  if (sq.questions.length === 1) return sq.questions[0];
  const key = sq.n;
  if (!G.squareQuestionsUsed[key]) G.squareQuestionsUsed[key] = [];
  const used = G.squareQuestionsUsed[key];
  const idx = used.length < sq.questions.length ? used.length : 0;
  if (idx === 0) G.squareQuestionsUsed[key] = [];
  G.squareQuestionsUsed[key].push(idx);
  return sq.questions[idx];
}

// ── Task modal ──
let currentSquare = null;

function showTaskModal(sq) {
  currentSquare = sq;
  const team = G.teams[G.currentTeam];
  const badge = {task:'台語任務',song:'台語歌謠',riddle:'台語猜謎',start:'起點',end:'終點'}[sq.type] || sq.type;
  const badgeColors = {task:'#2b6cb0',song:'#c05621',riddle:'#6b46c1'};
  document.getElementById('tm-emoji').textContent = sq.emoji;
  document.getElementById('tm-badge').textContent = badge;
  document.getElementById('tm-badge').style.background = (badgeColors[sq.type]||'#4a5568') + '33';
  document.getElementById('tm-badge').style.color = badgeColors[sq.type] || '#aaa';
  document.getElementById('tm-badge').style.border = '1px solid ' + (badgeColors[sq.type]||'#4a5568') + '66';
  document.getElementById('tm-title').textContent = sq.name;
  document.getElementById('tm-team').textContent = `${team.char.emoji} ${team.name} 的挑戰！`;
  document.getElementById('tm-desc').textContent = pickQuestion(sq);
  document.getElementById('tm-pts').innerHTML = `答對留在第 <span>${G.teams[G.currentTeam].pos}</span> 格，答錯退回第 <span>${G.prevPos}</span> 格`;

}

function completeTask() {
  stopTimer();
  const sq = currentSquare;
  const team = G.teams[G.currentTeam];
  addLog(`✓ ${team.name} 答對「${sq.name}」，留在第 ${team.pos} 格`);
  closeAllModals();
  renderScoreboard();
  toast(`${team.char.emoji} 答對！留在第 ${team.pos} 格！`);
  playSound('success');
  G.phase = 'roll';
  setTimeout(nextTurn, 1200);
}

function skipTask() {
  stopTimer();
  const sq = currentSquare;
  const team = G.teams[G.currentTeam];
  const backTo = G.prevPos;
  team.pos = backTo;
  renderTokens();
  addLog(`✗ ${team.name} 答錯「${sq.name}」，退回第 ${backTo} 格`);
  closeAllModals();
  renderScoreboard();
  G.phase = 'roll';
  toast(`✗ 答錯！退回第 ${backTo} 格！`);
  setTimeout(nextTurn, 1200);
}

// ── Timer ──
function startTimer(secs) {
  stopTimer();
  document.getElementById('task-timer').style.display = '';
  let left = secs;
  document.getElementById('timer-display').textContent = left;
  document.getElementById('timer-display').classList.remove('warn');
  timerInterval = setInterval(() => {
    left--;
    document.getElementById('timer-display').textContent = left;
    if (left <= 10) document.getElementById('timer-display').classList.add('warn');
    if (left <= 0) { stopTimer(); playSound('timeup'); }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const d = document.getElementById('timer-display');
  if (d) { d.classList.remove('warn'); }
}

// ── Cards ──
function drawCard(type) {
  G.phase = 'card';
  const pool = type === 'chance' ? G.chanceCards : G.fortuneCards;
  const card = pool[5] || pool[Math.floor(Math.random() * pool.length)]; // DEBUG: 固定第六張
  G.pendingCard = {card, type};
  const team = G.teams[G.currentTeam];
  const overlay = document.getElementById('card-modal-overlay');
  overlay.className = 'modal-overlay card-modal ' + type + '-modal';
  document.getElementById('cm-badge').textContent = type === 'chance' ? '⭐ 機　會' : '🎴 命　運';
  document.getElementById('cm-badge').style.background = type === 'chance' ? 'rgba(246,201,14,.15)' : 'rgba(229,62,62,.15)';
  document.getElementById('cm-badge').style.color = type === 'chance' ? '#f6c90e' : '#fc8181';
  document.getElementById('cm-title').textContent = type === 'chance' ? '幸運機會！' : '命運考驗！';
  document.getElementById('cf-emoji').textContent = type === 'chance' ? '⭐' : '🎴';
  document.getElementById('cf-label').textContent = '點擊翻牌！';
  document.getElementById('card-back').className = 'card-face card-back ' + type + '-back';
  document.getElementById('cb-emoji').textContent = card.emoji;
  document.getElementById('cb-text').textContent = card.text;
  document.getElementById('cm-content').style.display = 'none';
  document.getElementById('cm-effect').style.display = 'none';
  document.getElementById('cm-ok').style.display = 'none';
  const flip = document.getElementById('card-flip');
  flip.classList.remove('flipped');
  flip.style.cursor = 'pointer';
  flip.onclick = () => flipCard(card, type, team);
  overlay.classList.remove('hidden');
  playSound(type === 'chance' ? 'chance' : 'fortune');
}

function flipCard(card, type, team) {
  const flip = document.getElementById('card-flip');
  if (flip.classList.contains('flipped')) return;
  flip.classList.add('flipped');
  flip.onclick = null;
  flip.style.cursor = 'default';
  setTimeout(() => {
    const effectText = getEffectLabel(card, type, team);
    document.getElementById('cm-content').textContent = card.text;
    document.getElementById('cm-content').style.display = '';
    document.getElementById('cm-effect').textContent = '效果：' + effectText;
    document.getElementById('cm-effect').style.display = '';
    if (card.effect === 'give_score' || card.effect === 'give_move') {
      const otherTeams = G.teams.filter((_, idx) => idx !== G.currentTeam);
      if (otherTeams.length === 0) {
        document.getElementById('cm-team-pick').style.display = 'none';
        document.getElementById('cm-effect').textContent = '效果：只有一組，無法贈送，跳過';
        document.getElementById('cm-ok').style.display = 'block';
      } else {
        const pickEl = document.getElementById('cm-team-pick');
        const btnsEl = document.getElementById('cm-team-pick-btns');
        btnsEl.innerHTML = '';
        const steps = card.val > 0 && card.val <= 10 ? card.val : 1;
        G.teams.forEach((t, idx) => {
          if (idx === G.currentTeam) return;
          const btn = document.createElement('button');
          btn.style.cssText = 'padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px';
          btn.innerHTML = `<span style="font-size:1.3rem">${t.char.emoji}</span><span>${t.name}</span><span style="margin-left:auto;color:var(--gold)">前進 ${steps} 格</span>`;
          btn.style.borderColor = t.color;
          btn.onclick = () => giveMoveToTeam(card, idx);
          btnsEl.appendChild(btn);
        });
        pickEl.style.display = '';
        document.getElementById('cm-ok').style.display = 'none';
      }
    } else if (card.effect === 'swap_choose') {
      const otherTeams = G.teams.filter((_, idx) => idx !== G.currentTeam);
      if (otherTeams.length === 0) {
        document.getElementById('cm-team-pick').style.display = 'none';
        document.getElementById('cm-effect').textContent = '效果：只有一組，無法換位，跳過';
        document.getElementById('cm-ok').style.display = 'block';
      } else {
        const pickEl = document.getElementById('cm-team-pick');
        const btnsEl = document.getElementById('cm-team-pick-btns');
        btnsEl.innerHTML = '';
        const cur = G.teams[G.currentTeam];
        const label = document.createElement('div');
        label.style.cssText = 'font-size:.85rem;color:var(--muted);margin-bottom:4px;padding:0 2px';
        label.textContent = `選一組與 ${cur.char.emoji} ${cur.name}（第 ${cur.pos} 格）換位置：`;
        btnsEl.appendChild(label);
        G.teams.forEach((t, idx) => {
          if (idx === G.currentTeam) return;
          const btn = document.createElement('button');
          btn.style.cssText = 'padding:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;color:var(--text);font-size:.9rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px';
          btn.innerHTML = `<span style="font-size:1.3rem">${t.char.emoji}</span><span>${t.name}</span><span style="margin-left:auto;color:var(--gold)">第 ${t.pos} 格</span>`;
          btn.style.borderColor = t.color;
          btn.onclick = () => swapWithTeam(card, idx);
          btnsEl.appendChild(btn);
        });
        pickEl.style.display = '';
        document.getElementById('cm-ok').style.display = 'none';
      }
    } else {
      document.getElementById('cm-team-pick').style.display = 'none';
      document.getElementById('cm-ok').style.display = 'block';
    }
  }, 400);
}

function getEffectLabel(card, type, team) {
  switch(card.effect) {
    case 'move':       return (card.val > 0 ? '前進' : '後退') + Math.abs(card.val) + ' 格';
    case 'score':      return (card.val > 0 ? '前進 2 格' : '後退 1 格');
    case 'extra_roll': return '再擲一次骰子';
    case 'all_score':
    case 'all_move':   return '全組各前進 ' + (card.effect === 'all_score' ? 1 : card.val) + ' 格';
    case 'goto':       return '移動到第 ' + card.val + ' 格';
    case 'give_score':
    case 'give_move':  return '選一組前進 ' + (card.val > 0 && card.val <= 10 ? card.val : 1) + ' 格';
    case 'skip':       return '跳過下一回合';
    case 'swap_first':  return '與第一名互換位置';
    case 'swap_choose': return '選一組互換位置';
    case 'bonus_task':  return '完成任務前進 ' + (card.val > 0 && card.val <= 10 ? card.val : 3) + ' 格';
    default: return card.label || '';
  }
}

function giveMoveToTeam(card, recipientIdx) {
  const giver = G.teams[G.currentTeam];
  const recipient = G.teams[recipientIdx];
  const ctype = G.pendingCard ? G.pendingCard.type : 'chance';
  addLog(`${giver.char.emoji} ${giver.name} 抽到${ctype==='chance'?'機會':'命運'}卡：${card.emoji} ${card.label||''}`);
  const steps = card.val > 0 && card.val <= 10 ? card.val : 1;
  const newPos = Math.min(36, recipient.pos + steps);
  recipient.pos = newPos;
  addLog(`  → ${giver.name} 讓 ${recipient.char.emoji} ${recipient.name} 前進 ${steps} 格到第 ${newPos} 格`);
  toast(`🤝 ${recipient.name} 前進 ${steps} 格！`);
  renderTokens();
  renderScoreboard();
  closeAllModals();
  G.pendingCard = null;
  if (newPos === 36) { setTimeout(() => { G.currentTeam = recipientIdx; landOnSquare(36, true); }, 600); return; }
  nextTurn();
}
function giveScoreToTeam(card, recipientIdx) { giveMoveToTeam(card, recipientIdx); }

function swapWithTeam(card, targetIdx) {
  const cur = G.teams[G.currentTeam];
  const tgt = G.teams[targetIdx];
  const ctype = G.pendingCard ? G.pendingCard.type : 'fortune';
  addLog(`${cur.char.emoji} ${cur.name} 抽到${ctype==='chance'?'機會':'命運'}卡：${card.emoji} ${card.label||''}`);
  const tmpPos = cur.pos;
  cur.pos = tgt.pos;
  tgt.pos = tmpPos;
  addLog(`  → ${cur.char.emoji} ${cur.name} 與 ${tgt.char.emoji} ${tgt.name} 互換位置（第 ${cur.pos} 格 ↔ 第 ${tgt.pos} 格）`);
  toast(`🔀 ${cur.name} 與 ${tgt.name} 換位置！`);
  renderTokens();
  renderScoreboard();
  closeAllModals();
  G.pendingCard = null;
  nextTurn();
}

function confirmCard() {
  if (!G.pendingCard) return;
  const {card, type} = G.pendingCard;
  const team = G.teams[G.currentTeam];
  closeAllModals();
  applyCardEffect(card, type, team);
}

function applyCardEffect(card, type, team) {
  addLog(`${team.char.emoji} ${team.name} 抽到${type==='chance'?'機會':'命運'}卡：${card.emoji} ${card.label||card.text.split('\n')[0]}`);
  switch(card.effect) {
    case 'move': {
      const newPos = Math.max(1, Math.min(36, team.pos + card.val));
      team.pos = newPos;
      renderTokens();
      highlightSquare(newPos);
      addLog(`  → 移動到第 ${newPos} 格`);
      renderScoreboard();
      if (newPos === 36) { setTimeout(() => landOnSquare(36, true), 600); return; }
      if (card.val !== 0) { setTimeout(() => landOnSquare(newPos, true), 800); return; }
      break;
    }
    case 'score': {
      // 舊版相容：分數效果改成前進/後退格
      const mv = card.val > 0 ? 2 : -1;
      const newPos2 = Math.max(1, Math.min(36, team.pos + mv));
      team.pos = newPos2;
      renderTokens(); highlightSquare(newPos2);
      addLog(`  → ${mv > 0 ? '前進' : '後退'} ${Math.abs(mv)} 格，到第 ${newPos2} 格`);
      renderScoreboard();
      if (newPos2 === 36) { setTimeout(() => landOnSquare(36, true), 600); return; }
      setTimeout(() => landOnSquare(newPos2, true), 800);
      return;
    }
    case 'extra_roll':
      G.phase = 'roll';
      G.rolling = false;
      updateTurnBanner();
      document.getElementById('roll-btn').disabled = false;
      toast('🎲 再擲一次！');
      return;
    case 'all_score':
    case 'all_move': {
      const steps = card.effect === 'all_score' ? 1 : card.val;
      G.teams.forEach(t => { t.pos = Math.min(36, t.pos + steps); });
      addLog(`  → 全組各前進 ${steps} 格`);
      renderTokens(); renderScoreboard();
      toast(`🌟 全組各前進 ${steps} 格！`);
      break;
    }
    case 'goto': {
      team.pos = card.val;
      renderTokens();
      highlightSquare(card.val);
      addLog(`  → 傳送到第 ${card.val} 格`);
      renderScoreboard();
      setTimeout(() => landOnSquare(card.val, true), 800);
      return;
    }
    case 'give_score':
    case 'give_move':
      // 由 giveMoveToTeam() 處理，翻牌後顯示選組 UI
      break;
    case 'swap_choose':
      // 由 swapWithTeam() 處理，翻牌後顯示選組 UI
      break;
    case 'skip':
      team.skipTurns = (team.skipTurns || 0) + 1;
      addLog(`  → ${team.name} 下回合跳過`);
      toast('⏸ 跳過下一回合！');
      break;
    case 'swap_first': {
      const first = G.teams.reduce((a,b) => a.pos > b.pos ? a : b);
      if (first !== team) {
        const tmpPos = team.pos;
        team.pos = first.pos;
        first.pos = tmpPos;
        addLog(`  → ${team.name} 與 ${first.name} 交換位置`);
        renderTokens(); renderScoreboard();
        toast(`🔀 ${team.name} 與 ${first.name} 換位置！`);
      } else {
        addLog(`  → ${team.name} 已是第一名，效果無效`);
        toast('🔀 已是第一名，沒有效果！');
      }
      break;
    }
    case 'bonus_task':
      G.phase = 'task';
      document.getElementById('bm-team').textContent = `${team.char.emoji} ${team.name} 的挑戰！`;
      document.getElementById('bonus-modal-overlay').classList.remove('hidden');
      return;
  }
  G.phase = 'roll';
  setTimeout(nextTurn, 1500);
}

function completeBonusTask() {
  const team = G.teams[G.currentTeam];
  const card = G.pendingCard ? G.pendingCard.card : null;
  const steps = (card && card.val > 0 && card.val <= 10) ? card.val : 3;
  const newPos = Math.min(36, team.pos + steps);
  team.pos = newPos;
  addLog(`✓ ${team.name} 完成特別任務！前進 ${steps} 格到第 ${newPos} 格`);
  closeAllModals();
  renderTokens();
  renderScoreboard();
  toast(`🎤 完成特別任務！前進 ${steps} 格！`);
  playSound('success');
  G.phase = 'roll';
  G.pendingCard = null;
  if (newPos === 36) { setTimeout(() => landOnSquare(36, true), 600); return; }
  setTimeout(nextTurn, 1200);
}
function skipBonusTask() {
  addLog(`✗ ${G.teams[G.currentTeam].name} 跳過特別任務`);
  closeAllModals();
  G.phase = 'roll';
  G.pendingCard = null;
  setTimeout(nextTurn, 600);
}

function nextTurn() {
  G.phase = 'roll';
  G.rolling = false;
  document.getElementById('roll-btn').disabled = false;
  if (G.teams.some(t => t.finished)) { showGameOver(); return; }

  let next = (G.currentTeam + 1) % G.teams.length;
  let guard = 0;
  while (G.teams[next].finished && guard < G.teams.length) {
    next = (next + 1) % G.teams.length;
    guard++;
  }
  G.currentTeam = next;
  renderScoreboard();
  updateTurnBanner();
  renderLog();
}

function updateTurnBanner() {
  const team = G.teams[G.currentTeam];
  document.getElementById('tb-team').innerHTML = `
    <span style="font-size:1.5rem">${team.char.emoji}</span>
    <span style="color:${team.color}">${team.name}</span>`;
  const skipEl = document.getElementById('tb-skip');
  if (team.skipTurns > 0) {
    skipEl.textContent = `本回合休息（還剩 ${team.skipTurns} 次）`;
    skipEl.style.color = '';
    skipEl.style.background = '';
    skipEl.style.display = '';
  } else {
    skipEl.style.display = 'none';
  }
}

// ══════════════════════════════════
//  SCOREBOARD & LOG
// ══════════════════════════════════

function renderScoreboard() {
  const sorted = [...G.teams].map((t,i)=>({...t,origIdx:i}))
    .sort((a,b) => b.pos - a.pos);
  document.getElementById('scoreboard').innerHTML = sorted.map((t,rank) => `
    <div class="score-row${t.origIdx===G.currentTeam?' is-current':''}" style="border-left-color:${t.color}">
      <div style="font-size:.8rem;font-weight:700;color:var(--muted);width:16px;text-align:center">${rank+1}</div>
      <div class="sr-emoji" style="background:rgba(0,0,0,.3);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid ${t.color}">${t.char.emoji}</div>
      <div class="sr-info">
        <div class="sr-name" style="color:${t.color}">${esc(t.name)}</div>
        <div class="sr-pos">${t.finished?'🏆 到達終點！':`第 ${t.pos} 格`}${t.skipTurns>0?' ⏸':''}${t.origIdx===G.currentTeam&&!t.finished?' ◀':''}</div>
      </div>
    </div>`).join('');
}

function addLog(msg) {
  G.log.unshift(msg);
  if (G.log.length > 30) G.log.pop();
  renderLog();
}

function renderLog() {
  document.getElementById('log-list').innerHTML =
    G.log.map(l => `<div class="log-item">${esc(l)}</div>`).join('');
}

// ══════════════════════════════════
//  GAME OVER
// ══════════════════════════════════

function showGameOver() {
  G.phase = 'end';
  playSound('win');
  const winner = G.teams.find(t => t.finished) || [...G.teams].sort((a,b) => b.pos - a.pos)[0];
  document.getElementById('go-title').textContent = `🏆 ${winner.name} 獲勝！`;
  document.getElementById('go-sub').textContent = `恭喜 ${winner.char.emoji} ${winner.name}！你們是台語高手！`;
  const sorted = [...G.teams].sort((a,b) => b.pos - a.pos);
  const medals = ['🥇','🥈','🥉',''];
  document.getElementById('go-rankings').innerHTML = `
    <h3>最終排名</h3>
    ${sorted.map((t,i) => `
      <div class="rank-row">
        <div class="rank-num">${medals[i]||i+1}</div>
        <div class="rank-emoji">${t.char.emoji}</div>
        <div class="rank-info">
          <div class="rank-name" style="color:${t.color}">${esc(t.name)}</div>
          <div class="rank-detail">${t.finished ? '🏆 到達終點' : '第 ' + t.pos + ' 格'}</div>
        </div>
      </div>`).join('')}`;
  showScreen('gameover');
}

function restartGame() {
  G.teams.forEach(t => { t.pos = 1; t.score = 0; t.skipTurns = 0; t.finished = false; });
  G.currentTeam = 0;
  G.phase = 'roll';
  G.rolling = false;
  G.pendingCard = null;
  G.log = [];
  G.squareQuestionsUsed = {};
  G.prevPos = 1;
  closeAllModals();
  showScreen('game');
  renderBoard();
  renderTokens();
  renderScoreboard();
  renderLog();
  updateTurnBanner();
}

// ══════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════

function openSaveModal() {
  document.getElementById('save-name').value = `第${Math.floor(Math.random()*10+1)}節課`;
  document.getElementById('save-status').innerHTML = '';
  document.getElementById('save-modal-overlay').classList.remove('hidden');
}

function doSave() {
  const name = document.getElementById('save-name').value.trim() || '未命名';
  const state = {
    classId: G.classId,
    teams: G.teams.map(t => ({...t})),
    currentTeam: G.currentTeam,
    squares: G.squares,
    log: G.log,
    squareQuestionsUsed: G.squareQuestionsUsed,
    prevPos: G.prevPos,
  };
  // Save locally
  const saves = getLocalSaves();
  const existing = saves.findIndex(s => s.classId === G.classId && s.name === name);
  const entry = {name, classId: G.classId, time: new Date().toLocaleString('zh-TW'), state};
  if (existing >= 0) saves[existing] = entry; else saves.unshift(entry);
  localStorage.setItem('tl_saves', JSON.stringify(saves.slice(0,20)));
  const statusEl = document.getElementById('save-status');
  statusEl.className = 'save-status ok';
  statusEl.textContent = '✓ 已儲存到瀏覽器！';
  addLog(`💾 進度已儲存：${name}`);
  // Also try Sheets
  if (G.cfg.url) {
    saveToSheets(name, state).then(ok => {
      if (ok) { statusEl.textContent = '✓ 已同步到 Google 試算表！'; }
    });
  }
  setTimeout(closeAllModals, 1800);
}

async function saveToSheets(name, state) {
  if (!APPS_SCRIPT_URL) return false;
  try {
    const res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({action:'saveProgress', classId: G.classId, name, state: JSON.stringify(state)}),
    });
    const data = await res.json();
    return data.success;
  } catch(e) { return false; }
}

async function loadQuestionsFromSheets() {
  if (!APPS_SCRIPT_URL) return;
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?action=getQuestions');
    const data = await res.json();
    if (data.questions && data.questions.length >= G.squares.length) {
      // 試算表題數 >= 本機題數才覆蓋，避免舊版資料把新格子蓋掉
      G.squares = data.questions;
      renderBoard();
      renderTokens();
    }
    if (data.chanceCards) G.chanceCards = data.chanceCards;
    if (data.fortuneCards) G.fortuneCards = data.fortuneCards;
  } catch(e) { /* 網路失敗：保留本地備用題目 */ }
}

// ══════════════════════════════════
//  SETTINGS
// ══════════════════════════════════

function openSettingsModal() {
  document.getElementById('cfg-sound').checked = G.cfg.sound;
  document.getElementById('cfg-timer').checked = G.cfg.timer;
  document.getElementById('settings-modal-overlay').classList.remove('hidden');
}

function saveSettings() {
  G.cfg.sound  = document.getElementById('cfg-sound').checked;
  G.cfg.timer  = document.getElementById('cfg-timer').checked;
  localStorage.setItem('cfg_sound', G.cfg.sound ? 'on' : 'off');
  localStorage.setItem('cfg_timer', G.cfg.timer ? 'on' : 'off');
  closeAllModals();
  toast('設定已儲存！');
}

// ══════════════════════════════════
//  SOUND (Web Audio API)
// ══════════════════════════════════

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  if (!G.cfg.sound) return;
  try {
    const ctx = getAudioCtx();
    if (ctx.state === 'suspended') ctx.resume();
    const t = ctx.currentTime;
    if (type === 'roll') {
      for (let i = 0; i < 6; i++) {
        const buf = ctx.createBuffer(1,2048,ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let j=0;j<2048;j++) d[j]=Math.random()*2-1;
        const src = ctx.createBufferSource(); src.buffer = buf;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.25, t+i*.12);
        g.gain.exponentialRampToValueAtTime(0.001, t+i*.12+.1);
        src.connect(g); g.connect(ctx.destination);
        src.start(t+i*.12); src.stop(t+i*.12+.12);
      }
    } else if (type === 'land') {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.setValueAtTime(660, t);
      osc.frequency.exponentialRampToValueAtTime(440, t+.3);
      g.gain.setValueAtTime(0.4, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+.4);
      osc.start(t); osc.stop(t+.45);
    } else if (type === 'task') {
      [523,659].forEach((f,i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.3, t+i*.1);
        g.gain.exponentialRampToValueAtTime(0.001, t+i*.1+.15);
        osc.start(t+i*.1); osc.stop(t+i*.1+.2);
      });
    } else if (type === 'chance') {
      [523,659,784,1046].forEach((f,i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.35, t+i*.1);
        g.gain.exponentialRampToValueAtTime(0.001, t+i*.1+.18);
        osc.start(t+i*.1); osc.stop(t+i*.1+.22);
      });
    } else if (type === 'fortune') {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sawtooth';
      osc.connect(g); g.connect(ctx.destination);
      osc.frequency.setValueAtTime(350, t);
      osc.frequency.exponentialRampToValueAtTime(150, t+.6);
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t+.65);
      osc.start(t); osc.stop(t+.7);
    } else if (type === 'success') {
      [523,659,784].forEach((f,i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.3, t+i*.08);
        g.gain.exponentialRampToValueAtTime(0.001, t+i*.08+.15);
        osc.start(t+i*.08); osc.stop(t+i*.08+.2);
      });
    } else if (type === 'win') {
      [523,659,784,659,784,1046,1175].forEach((f,i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f;
        const st = t + i*.13;
        g.gain.setValueAtTime(0.4, st);
        g.gain.exponentialRampToValueAtTime(0.001, st+.2);
        osc.start(st); osc.stop(st+.25);
      });
    } else if (type === 'timeup') {
      [880,660,440].forEach((f,i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.frequency.value = f;
        g.gain.setValueAtTime(0.4, t+i*.15);
        g.gain.exponentialRampToValueAtTime(0.001, t+i*.15+.2);
        osc.start(t+i*.15); osc.stop(t+i*.15+.25);
      });
    }
  } catch(e) {}
}

// ══════════════════════════════════
//  UTILITIES
// ══════════════════════════════════

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function closeAllModals() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.classList.add('hidden'));
  stopTimer();
}

function showNotification(msg) { toast(msg); }

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ══════════════════════════════════
//  INIT
// ══════════════════════════════════

initSetup();
</script>
